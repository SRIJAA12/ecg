<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO ────────────────────────────────────────────────────────────── -->
    <title>Healthcare Simulation Monitor</title>
    <meta
      name="description"
      content="Professional ECG waveform viewer using real MIT-BIH Arrhythmia Database signals. Phase 1 of the Healthcare Simulation Monitor."
    />

    <!-- ── Favicon ────────────────────────────────────────────────────────── -->
    <!-- Using SVG data URI for a simple ECG pulse icon — no external file needed -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🫀</text></svg>"
    />

    <!-- ── Google Fonts ───────────────────────────────────────────────────── -->
    <!-- Inter: Used for all UI text (numeric displays, labels, controls)     -->
    <!-- Preconnect improves load performance by establishing connection early  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      The React application mounts here.
      "root" is the conventional id — App.tsx renders into this div.
    -->
    <div id="root"></div>

    <!--
      Vite replaces this script tag at build time.
      type="module" is required for ES module imports to work in the browser.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
